name: Python Tests

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "/.gitignore"
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BigConfig
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout local Selmer dependency
        run: |
          sudo mkdir -p /home/ubuntu/code/bigconfig/Selmer
          sudo chown -R "$USER:$USER" /home/ubuntu
          git clone --depth 1 --branch python https://github.com/bigconfig-ai/Selmer.git /home/ubuntu/code/bigconfig/Selmer/python

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

# test locally
# uv sync --frozen && uv run pytest -q

  tag:
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: set-artifact-tag-version
        run: echo "ARTIFACT_TAG_VERSION=0.3.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - id: create-tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.set-artifact-tag-version.outputs.ARTIFACT_TAG_VERSION }}
          force_push_tag: true
