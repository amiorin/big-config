[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "big-config"
version = "0.3.0"
description = "Python rewrite of BigConfig workflow and template automation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BigConfig contributors" }]
dependencies = [
  "selmer @ git+https://github.com/bigconfig-ai/Selmer.git@d6db31695ba1c06abefe30d6ed8a1dedc0de110a",
]

[project.scripts]
big-config = "big_config.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/big_config", "src/big_tofu"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
